<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">TEMA</span>
          <label class="switch">
            <input type="checkbox" id="theme-switch" aria-label="Alternar tema claro/oscuro" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">

        <!-- Game Over view -->
        <div id="view-gameover" class="overlay-view">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn" class="menu-btn">Reiniciar</button>
        </div>

        <!-- Pause menu view -->
        <div id="view-pause" class="overlay-view hidden">
          <p class="overlay-heading">PAUSA</p>
          <button id="btn-resume" class="menu-btn">Reanudar</button>
          <button id="btn-restart" class="menu-btn">Reiniciar partida</button>
          <button id="btn-controls" class="menu-btn">Ver controles</button>
          <div class="menu-level-row">
            <label for="start-level-input" class="menu-label">Nivel inicial</label>
            <input id="start-level-input" type="number" min="1" max="10" value="1" class="level-input" />
          </div>
        </div>

        <!-- Controls sub-view -->
        <div id="view-controls" class="overlay-view hidden">
          <p class="overlay-heading">CONTROLES</p>
          <ul class="controls-list">
            <li><kbd>←</kbd> <kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar suave</li>
            <li><kbd>Espacio</kbd> caída rápida</li>
            <li><kbd>P</kbd> / <kbd>Escape</kbd> pausar</li>
          </ul>
          <button id="btn-back" class="menu-btn">Volver</button>
        </div>

      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
